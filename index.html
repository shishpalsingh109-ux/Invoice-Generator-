    <div id="error-overlay" style="display: none; padding: 20px; background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; font-family: monospace; margin: 20px; border-radius: 8px; white-space: pre-wrap; z-index: 9999; position: relative;">

      <div id="error-message"></div>
    </div>
    
    <script>
      // Capture load/runtime errors
      window.addEventListener('error', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-message').textContent += event.message + '\n' + (event.error ? event.error.stack : '') + '\n\n';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-message').textContent += 'Unhandled Rejection: ' + event.reason + '\n\n';
      });
      // Capture Babel/Console compilation errors
      const originalConsoleError = console.error;
      console.error = function() {
        originalConsoleError.apply(console, arguments);
        document.getElementById('error-overlay').style.display = 'block';
        let msg = Array.from(arguments).map(arg => {
          if (arg instanceof Error) return arg.message + '\n' + arg.stack;
          if (typeof arg === 'object') {
            try { return JSON.stringify(arg); } catch(e) { return String(arg); }
          }
          return String(arg);
        }).join(' ');
        document.getElementById('error-message').textContent += msg + '\n\n';
      };
    </script>

// --- UTILITY FUNCTIONS ---
const capitalizeWords = (str) => {
    if (!str) return '';
    return str.replace(/\b\w/g, char => char.toUpperCase());
};

const capitalizeFirstLetter = (str) => {
    if (!str) return '';
    return str.charAt(0).toUpperCase() + str.slice(1);
};

const formatIndianNumber = (numStr, decimalPlaces = 2) => {
    const num = Number(numStr);
    if (isNaN(num)) return typeof numStr === 'string' ? numStr : (decimalPlaces > 0 ? '0.' + '0'.repeat(decimalPlaces) : '0');

    let [integerPart, decimalPart] = num.toFixed(decimalPlaces).split('.');
    
    if (integerPart.length > 3) {
        const lastThree = integerPart.substring(integerPart.length - 3);
        const otherNumbers = integerPart.substring(0, integerPart.length - 3);
        integerPart = otherNumbers.replace(/(\d)(?=(\d\d)+(?!\d))/g, "$1,") + ',' + lastThree;
    }
    
    return decimalPlaces > 0 ? `${integerPart}.${decimalPart}` : integerPart;
};


const numberToWords = (num) => {
    const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    const s = ['', 'Thousand', 'Lakh', 'Crore'];

    const toWords = (n) => {
        if (n < 20) return a[n] || '';
        if (n < 100) return (b[Math.floor(n / 10)] + (n % 10 !== 0 ? ' ' + a[n % 10] : '')).trim();
        if (n < 1000) return (a[Math.floor(n / 100)] + ' Hundred' + (n % 100 !== 0 ? ' ' + toWords(n % 100) : '')).trim();
        return '';
    };

    if (num === 0) return 'Zero Only';
    
    let result = '';
    let tempNum = Math.floor(num);
    let i = 0;
    while (tempNum > 0) {
        let chunk;
        if (i === 0) {
            chunk = tempNum % 1000;
            tempNum = Math.floor(tempNum / 1000);
        } else {
            chunk = tempNum % 100;
            tempNum = Math.floor(tempNum / 100);
        }

        if (chunk > 0) {
            const chunkInWords = toWords(chunk);
            result = chunkInWords + ' ' + (s[i] || '') + ' ' + result;
        }
        i++;
        if (i >= s.length) break; 
    }

    return result.trim().replace(/\s+/g, ' ') + ' Only';
};

const EditableTextarea = ({ value, onChange, onBlur, placeholder = '', className = '' }) => {

    useEffect(() => {
        if (textareaRef.current) {
            textareaRef.current.style.height = 'auto'; // Reset height
            textareaRef.current.style.height = `${textareaRef.current.scrollHeight}px`; // Set to scroll height
        }
    }, [value]);

    return (
        <textarea
            ref={textareaRef}
            value={value}
            onChange={onChange}
            onBlur={onBlur}
            placeholder={placeholder}
            className={`bg-transparent p-1 w-full focus:outline-none focus:bg-blue-50/50 rounded-md transition-colors resize-none overflow-y-hidden ${className}`}
            rows={1}
        />
    );
};

const EditableNumberField = ({ value, onChange, className = '', decimalPlaces = 2 }) => {
    const [localString, setLocalString] = useState(String(value));
    const [isFocused, setIsFocused] = useState(false);

    useEffect(() => {
        if (!isFocused) {
            setLocalString(formatIndianNumber(value, decimalPlaces));
        }
    }, [value, isFocused, decimalPlaces]);

    const handleFocus = () => {
        setIsFocused(true);
        setLocalString(String(value));
    };

    const handleChange = (e) => {
        const newString = e.target.value;
        setLocalString(newString);

        const numericValue = parseFloat(newString.replace(/,/g, ''));
        if (!isNaN(numericValue)) {
            onChange(numericValue);
        } else if (newString === '' || newString === '.') {
            onChange(0);
        }
    };

    const handleBlur = () => {
        setIsFocused(false);
        const numericValue = parseFloat(localString.replace(/,/g, ''));
        let finalValue = isNaN(numericValue) ? 0 : numericValue;

        if (decimalPlaces === 0) {
            finalValue = Math.round(finalValue);
        }
        
        onChange(finalValue);
    };

    return (
        <input
            type="text"
            value={localString}
            onFocus={handleFocus}
            onBlur={handleBlur}
            onChange={handleChange}
            className={className}
        />
    );
};

// --- MAIN APP COMPONENT ---
const App = () => {
    // --- STATE MANAGEMENT ---
    const getInitialState = () => ({
        invoiceDetails: {
            invoiceNo: '',
            dated: new Date().toISOString().split('T')[0],
            placeOfSupply: '',
        },
        billedTo: { name: '', address: '', gstin: '' },
        shippedTo: { name: '', address: '', gstin: '' },
        items: [{
            id: Date.now().toString(),
            name: '', detailedDescription: '', hsn: '', qty: 1, unit: 'Pcs.', price: 0, cgstRate: 9, sgstRate: 9, igstRate: 18, subItems: []
        }],
        signature: null,
        terms: `1. Goods once sold will not be taken back.\n2. Interest @ 18% p.a. will be charged if the payment is not made with in the stipulated time.\n3. Subject to 'Delhi' Jurisdiction only.`,
    });

    const [invoiceDetails, setInvoiceDetails] = useState(getInitialState().invoiceDetails);
    const [billedTo, setBilledTo] = useState(getInitialState().billedTo);
    const [shippedTo, setShippedTo] = useState(getInitialState().shippedTo);
    const [items, setItems] = useState(getInitialState().items);
    const [signature, setSignature] = useState(getInitialState().signature);
    const [terms, setTerms] = useState(getInitialState().terms);
    const [notification, setNotification] = useState(null);
    const [gstinErrors, setGstinErrors] = useState({ billedTo: '', shippedTo: '' });

    const prevBilledToRef = useRef(billedTo);
    
    const isIntraState = useMemo(() => invoiceDetails.placeOfSupply.includes('Delhi (07)'), [invoiceDetails.placeOfSupply]);


    const showNotification = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => {
            setNotification(null);
        }, 3000);
    };
    
    // --- VALIDATION ---
    const validateGstin = (gstin) => {
        if (!gstin) return '';
        const gstinRegex = /^\d{2}[A-Z]{5}\d{4}[A-Z]{1}\d{1}[A-Z]{2}$/;
        const stateCode = gstin.substring(0, 2);

        if (!gstinRegex.test(gstin)) {
            return "Invalid GSTN/UIN format.";
        }
        if (!stateCodeMap[stateCode]) {
            return "Invalid state code in GSTIN.";
        }

        return '';
    };

    // Auto-update Place of Supply from GSTIN
    useEffect(() => {
        const gstin = billedTo.gstin;
        const isValid = validateGstin(gstin) === '';
        
        if (isValid && gstin.trim().length >= 2) {
            const stateCode = gstin.substring(0, 2);
            const stateName = stateCodeMap[stateCode];
            if (stateName) {
                setInvoiceDetails(prevDetails => ({
                    ...prevDetails,
                    placeOfSupply: `${stateName} (${stateCode})`
                }));
            }
        }
    }, [billedTo.gstin]);

    // Auto-fill Shipped to details from Billed to details (with manual override)
    useEffect(() => {
        const prevBilledTo = prevBilledToRef.current;
        if (JSON.stringify(shippedTo) === JSON.stringify(prevBilledTo)) {
            setShippedTo(billedTo);
        }
        prevBilledToRef.current = billedTo;
    }, [billedTo, shippedTo]);
    
    // Convert tax rates when tax type (intra/inter-state) changes
    useEffect(() => {
        setItems(prevItems =>
            prevItems.map(item => {
                if (isIntraState) {
                    // Switched to Intra-State (CGST/SGST) from IGST
                    const newRate = item.igstRate / 2;
                    return { ...item, cgstRate: newRate, sgstRate: newRate };
                } else {
                    // Switched to Inter-State (IGST) from CGST/SGST
                    const newRate = item.cgstRate + item.sgstRate;
                    return { ...item, igstRate: newRate };
                }
            })
        );
    }, [isIntraState]);


    // --- EVENT HANDLERS ---
     const handleReset = () => {
        if (window.confirm('Are you sure you want to reset the invoice? All data will be erased.')) {
            const initialState = getInitialState();
            setInvoiceDetails(initialState.invoiceDetails);
            setBilledTo(initialState.billedTo);
            setShippedTo(initialState.shippedTo);
            setItems(initialState.items);
            setSignature(initialState.signature);
            setGstinErrors({ billedTo: '', shippedTo: '' });
            showNotification('Invoice has been reset.', 'info');
        }
    };
    
    const handleGstinChange = (party, value) => {
        const upperValue = value.toUpperCase();
        const error = validateGstin(upperValue);

        setGstinErrors(prev => ({ ...prev, [party]: error }));

        if (party === 'billedTo') {
            setBilledTo(prev => ({ ...prev, gstin: upperValue }));
        } else {
            setShippedTo(prev => ({ ...prev, gstin: upperValue }));
        }
    };

    const handleItemChange = (id, field, value) => {
        setItems(prevItems =>
            prevItems.map(item => {
                if (item.id === id) {
                    let processedValue = value;
                    if (field === 'name' && typeof value === 'string') {
                        processedValue = capitalizeFirstLetter(value);
                    }
                    
                    const updatedItem = { ...item, [field]: processedValue };
                    if (field === 'cgstRate') {
                        updatedItem.sgstRate = Number(value);
                    } else if (field === 'sgstRate') {
                        updatedItem.cgstRate = Number(value);
                    }
                    return updatedItem;
                }
                return item;
            })
        );
    };

    const handleItemBlur = (id, field) => {
        if (field !== 'detailedDescription') return;

        setItems(prevItems =>
            prevItems.map(item => {
                if (item.id === id) {
                    let value = item.detailedDescription.trim();
                    if (value) {
                        if (value.startsWith('(')) {
                            value = value.substring(1);
                        }
                        if (value.endsWith(')')) {
                            value = value.substring(0, value.length - 1);
                        }
                        value = `(${value.trim()})`;
                    }
                    return { ...item, detailedDescription: value };
                }
                return item;
            })
        );
    };

    const addItem = () => {
        const newItem = {
            id: Date.now().toString(),
            name: '',
            detailedDescription: '',
            hsn: '',
            qty: 1,
            unit: 'Pcs.',
            price: 0,
            cgstRate: 9,
            sgstRate: 9,
            igstRate: 18,
            subItems: [],
        };
        setItems([...items, newItem]);
    };

    const removeItem = (id) => {
        setItems(prevItems => prevItems.filter(item => item.id !== id));
    };

    const addSubItem = (parentId) => {
        setItems(prevItems =>
            prevItems.map(item => {
                if (item.id === parentId) {
                    const currentSubItems = item.subItems || [];
                    const newSubItem = {
                        id: Date.now().toString() + '_' + Math.random().toString(36).substr(2, 5),
                        name: '',
                        detailedDescription: '',
                        qty: 1,
                        unit: item.unit || 'Pcs.',
                        price: 0
                    };
                    return { ...item, subItems: [...currentSubItems, newSubItem] };
                }
                return item;
            })
        );
    };

    const removeSubItem = (parentId, subId) => {
        setItems(prevItems =>
            prevItems.map(item => {
                if (item.id === parentId) {
                    const currentSubItems = item.subItems || [];
                    const updatedSubItems = currentSubItems.filter(sub => sub.id !== subId);
                    return { ...item, subItems: updatedSubItems };
                }
                return item;
            })
        );
    };

    const handleSubItemChange = (parentId, subId, field, value) => {
        setItems(prevItems =>
            prevItems.map(item => {
                if (item.id === parentId) {
                    const currentSubItems = item.subItems || [];
                    const updatedSubItems = currentSubItems.map(sub => {
                        if (sub.id === subId) {
                            let processedValue = value;
                            if (field === 'name' && typeof value === 'string') {
                                processedValue = capitalizeFirstLetter(value);
                            }
                            return { ...sub, [field]: processedValue };
                        }
                        return sub;
                    });
                    return { ...item, subItems: updatedSubItems };
                }
                return item;
            })
        );
    };

    const handleSubItemBlur = (parentId, subId, field) => {
        if (field !== 'detailedDescription') return;
        setItems(prevItems =>
            prevItems.map(item => {
                if (item.id === parentId) {
                    const currentSubItems = item.subItems || [];
                    const updatedSubItems = currentSubItems.map(sub => {
                        if (sub.id === subId) {
                            let value = (sub.detailedDescription || '').trim();
                            if (value) {
                                if (value.startsWith('(')) value = value.substring(1);
                                if (value.endsWith(')')) value = value.substring(0, value.length - 1);
                                value = `(${value.trim()})`;
                            }
                            return { ...sub, detailedDescription: value };
                        }
                        return sub;
                    });
                    return { ...item, subItems: updatedSubItems };
                }
                return item;
            })
        );
    };

    const handleSignatureUpload = (event) => {
        if (event.target.files && event.target.files[0]) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                setSignature(reader.result);
            };
            reader.readAsDataURL(file);
        }
    };

    // --- CALCULATIONS (MEMOIZED) ---
    const calculations = useMemo(() => {
        let taxableAmount = 0;
        let totalCgst = 0;
        let totalSgst = 0;
        let totalIgst = 0;
        let totalQty = 0;

        const calculatedItemsWithNumbers = items.map(item => {
            const hasSubItems = item.subItems && item.subItems.length > 0;
            const calculatedSubItems = (item.subItems || []).map(sub => {
                const subAmt = (Number(sub.qty) || 0) * (Number(sub.price) || 0);
                return {
                    ...sub,
                    amount: subAmt,
                    formattedAmount: formatIndianNumber(subAmt)
                };
            });

            const itemAmount = hasSubItems
                ? calculatedSubItems.reduce((sum, s) => sum + s.amount, 0)
                : (Number(item.qty) || 0) * (Number(item.price) || 0);

            const effectivePrice = hasSubItems ? (item.qty ? itemAmount / item.qty : itemAmount) : item.price;

            let cgstAmount = 0;
            let sgstAmount = 0;
            let igstAmount = 0;
            
            if (isIntraState) {
                cgstAmount = itemAmount * (item.cgstRate / 100);
                sgstAmount = itemAmount * (item.sgstRate / 100);
            } else {
                igstAmount = itemAmount * (item.igstRate / 100);
            }

            const totalAmount = itemAmount + cgstAmount + sgstAmount + igstAmount;

            taxableAmount += itemAmount;
            totalQty += Number(item.qty) || 0;
            totalCgst += cgstAmount;
            totalSgst += sgstAmount;
            totalIgst += igstAmount;

            return {
                ...item,
                price: effectivePrice,
                itemAmount,
                cgstAmount,
                sgstAmount,
                igstAmount,
                totalAmount,
                calculatedSubItems,
                hasSubItems,
            };
        });

        const totalTax = isIntraState ? totalCgst + totalSgst : totalIgst;
        const grandTotal = taxableAmount + totalTax;

        return {
            calculatedItems: calculatedItemsWithNumbers.map(item => ({
                ...item,
                itemAmount: item.itemAmount,
                cgstAmount: formatIndianNumber(item.cgstAmount),
                sgstAmount: formatIndianNumber(item.sgstAmount),
                igstAmount: formatIndianNumber(item.igstAmount),
                totalAmount: formatIndianNumber(item.totalAmount),
            })),
            totalQty,
            taxableAmount: formatIndianNumber(taxableAmount),
            totalCgst: formatIndianNumber(totalCgst),
            totalSgst: formatIndianNumber(totalSgst),
            totalIgst: formatIndianNumber(totalIgst),
            totalTax: formatIndianNumber(totalTax),
            grandTotal: formatIndianNumber(grandTotal),
                    grandTotalNumber: grandTotal,
            grandTotalRounded: Math.round(grandTotal),
        };
    }, [items, isIntraState]);

    const handlePrint = () => {
        window.print();
    };

    const handleExportPdf = () => {
        if (!window.jspdf || !window.jspdf.jsPDF) {
            showNotification('PDF generation library not loaded. Please refresh and try again.', 'error');
            return;
        }

        const { jsPDF } = window.jspdf;
        // A4 portrait
        const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

        const PW = doc.internal.pageSize.getWidth();   // 210mm
        const PH = doc.internal.pageSize.getHeight();  // 297mm
        const ML = 12; // left margin
        const MR = 12; // right margin
        const MT = 12; // top margin
        const MB = 15; // bottom margin
        const CW = PW - ML - MR; // content width

        // ── Colour helpers ──────────────────────────────────────────────
        const setFill   = (r,g,b) => doc.setFillColor(r,g,b);
        const setStroke = (r,g,b) => doc.setDrawColor(r,g,b);
        const setTxt    = (r,g,b) => doc.setTextColor(r,g,b);

        // ── Muted Teal Theme Palette ────────────────────────────────────
        const T_PRIMARY   = [60, 110, 108];   // dark muted teal  — headers, bars, GT box
        const T_ACCENT    = [100, 155, 153];  // medium teal      — borders, dividers
        const T_LIGHT     = [225, 240, 239];  // very light teal  — meta/party box fills
        const T_SHADE     = [240, 247, 247];  // pale teal        — alternating row tint
        const T_ON_DARK   = [255, 255, 255];  // white            — text on teal bg
        const T_DARK_TXT  = [30,  40,  40];   // near-black teal  — main body text
        const T_MID_TXT   = [80,  100, 100];  // medium teal-grey — labels/subtext
        const T_LIGHT_TXT = [130, 155, 153];  // light teal-grey  — placeholders

        // ── Text helpers ────────────────────────────────────────────────
        const txt = (text, x, y, opts={}) => doc.text(String(text||''), x, y, opts);
        const bold   = (sz) => { doc.setFontSize(sz); doc.setFont('helvetica','bold'); };
        const normal = (sz) => { doc.setFontSize(sz); doc.setFont('helvetica','normal'); };

        // ── Rect helper ─────────────────────────────────────────────────
        const rect = (x,y,w,h,style='S') => doc.rect(x,y,w,h,style);

        // ── DRAW PAGE HEADER (repeats on every page) ────────────────────
        const drawPageHeader = () => {
            let y = MT;

            // Top border bar — thick teal stripe
            setFill(...T_PRIMARY);
            doc.rect(ML, y, CW, 2, 'F');

            // Company name (left) + "Tax Invoice" (right)
            bold(16); setTxt(...T_PRIMARY);
            txt('GOODPSYCHE', ML, y + 6);

            bold(18); setTxt(...T_PRIMARY);
            txt('TAX INVOICE', PW - MR, y + 6, { align: 'right' });

            // Sublines
            normal(8); setTxt(...T_MID_TXT);
            txt('Basement M-29, Vinoba Puri, Near Round Park,', ML, y + 11);
            txt('Lajpat Nagar, New Delhi - 110024', ML, y + 15);

            normal(8); setTxt(...T_LIGHT_TXT);
            txt('Original Copy', PW - MR, y + 11, { align: 'right' });

            bold(8); setTxt(...T_DARK_TXT);
            txt('GSTIN/UIN: ', ML, y + 20);
            normal(8); setTxt(...T_PRIMARY);
            txt('07AAWFG0897P1ZA', ML + 18, y + 20);

            y += 24;

            // Divider
            setStroke(...T_ACCENT);
            doc.setLineWidth(0.4);
            doc.line(ML, y, PW - MR, y);
            y += 4;

            // ── Invoice meta row (Invoice No, Date, Place of Supply) ──
            const colW = CW / 3;

            // Invoice No box
            setStroke(...T_ACCENT);
            doc.rect(ML, y, colW, 10, 'S');

            bold(9); setTxt(...T_DARK_TXT); txt(invoiceDetails.invoiceNo || '-', ML+2, y+8.5);

            y += 13;

            // ── Party details (Billed To / Shipped To) ───────────────
            const halfW = CW / 2;

            // Billed To
            setStroke(...T_ACCENT);
            doc.rect(ML, y, halfW, 28, 'S');
            bold(7); setTxt(...T_PRIMARY); txt('BILLED TO', ML+2, y+5);
            bold(9); setTxt(...T_DARK_TXT);
            const btName = doc.splitTextToSize(billedTo.name || '-', halfW-4);
            btName.slice(0,2).forEach((l,i) => txt(l, ML+2, y+10+(i*4)));
            normal(8); setTxt(...T_MID_TXT);
            const btAddr = doc.splitTextToSize(billedTo.address || '', halfW-4);
            btAddr.slice(0,3).forEach((l,i) => txt(l, ML+2, y+19+(i*3.5)));
            bold(7.5); setTxt(...T_MID_TXT);
            txt('GSTIN: ', ML+2, y+26); normal(7.5); setTxt(...T_PRIMARY); txt(billedTo.gstin||'-', ML+12, y+26);

            // Shipped To
            doc.rect(ML+halfW, y, halfW, 28, 'S');
            bold(7); setTxt(...T_PRIMARY); txt('SHIPPED TO', ML+halfW+2, y+5);
            bold(9); setTxt(...T_DARK_TXT);
            const stName = doc.splitTextToSize(shippedTo.name || '-', halfW-4);
            stName.slice(0,2).forEach((l,i) => txt(l, ML+halfW+2, y+10+(i*4)));
            normal(8); setTxt(...T_MID_TXT);
            const stAddr = doc.splitTextToSize(shippedTo.address || '', halfW-4);
            stAddr.slice(0,3).forEach((l,i) => txt(l, ML+halfW+2, y+19+(i*3.5)));
            bold(7.5); setTxt(...T_MID_TXT);
            txt('GSTIN: ', ML+halfW+2, y+26); normal(7.5); setTxt(...T_PRIMARY); txt(shippedTo.gstin||'-', ML+halfW+12, y+26);

            y += 31;

            // ── Items table header row ───────────────────────────────
            setFill(...T_PRIMARY); setStroke(...T_PRIMARY);
            doc.rect(ML, y, CW, 7, 'F');
            bold(7); setTxt(...T_ON_DARK);

            // Column x-positions and widths (must match data rows below)
            const cols = isIntraState
                ? [
                    { label:'S.N.',     x:ML,                    w:8,   align:'center' },
                    { label:'Description', x:ML+8,              w:48,  align:'left'   },
                    { label:'HSN/SAC',  x:ML+56,                 w:16,  align:'center' },
                    { label:'Qty',      x:ML+72,                 w:10,  align:'right'  },
                    { label:'Unit',     x:ML+82,                 w:12,  align:'center' },
                    { label:'Price',    x:ML+94,                 w:18,  align:'right'  },
                    { label:'CGST%',    x:ML+112,                w:12,  align:'right'  },
                    { label:'CGST Amt', x:ML+124,                w:18,  align:'right'  },
                    { label:'SGST%',    x:ML+142,                w:12,  align:'right'  },
                    { label:'SGST Amt', x:ML+154,                w:18,  align:'right'  },
                    { label:'Amount',   x:ML+172,                w:14,  align:'right'  },
                  ]
                : [
                    { label:'S.N.',     x:ML,                    w:8,   align:'center' },
                    { label:'Description', x:ML+8,              w:58,  align:'left'   },
                    { label:'HSN/SAC',  x:ML+66,                 w:18,  align:'center' },
                    { label:'Qty',      x:ML+84,                 w:12,  align:'right'  },
                    { label:'Unit',     x:ML+96,                 w:14,  align:'center' },
                    { label:'Price',    x:ML+110,                w:20,  align:'right'  },
                    { label:'IGST%',    x:ML+130,                w:14,  align:'right'  },
                    { label:'IGST Amt', x:ML+144,                w:22,  align:'right'  },
                    { label:'Amount',   x:ML+166,                w:20,  align:'right'  },
                  ];

            cols.forEach(c => {
                const xOff = c.align === 'right' ? c.x+c.w-1 : c.align === 'center' ? c.x+c.w/2 : c.x+1;
                txt(c.label, xOff, y+4.8, { align: c.align === 'right' ? 'right' : c.align === 'center' ? 'center' : 'left' });
            });

            y += 7;
            doc.setLineWidth(0.1); setStroke(...T_ACCENT);

            return { y, cols };
        };

        // ── Row height constants ──────────────────────────────────────
        const ROW_MIN_H   = 8;    // minimum row height mm
        const NAME_LINE_H = 4.5; // mm per name line
        const DESC_LINE_H = 3.8; // mm per description line
        const ROW_PAD     = 3;   // top + bottom padding mm

        // Returns the description column definition for the current tax mode
        const getDescCol = (cols) => cols[1]; // always index 1

                // Calculate actual row height based on text wrapping
        const calcRowHeight = (item, cols, isSubItem = false) => {
            const descCol = getDescCol(cols);
            const colW = descCol.w - 2 - (isSubItem ? 4 : 0);

            // Name wrapping
            const nameStr = item.name || '';
            doc.setFontSize(isSubItem ? 7.5 : 8); doc.setFont('helvetica', isSubItem ? 'normal' : 'bold');
            const nameLines = doc.splitTextToSize(nameStr, colW);
            const nameH = nameLines.length * NAME_LINE_H;

            // Description wrapping (italic, smaller)
            let descH = 0;
            const descStr = item.detailedDescription || '';
            if (descStr) {
                doc.setFontSize(6.5); doc.setFont('helvetica', 'italic');
                const descLines = doc.splitTextToSize(descStr, colW);
                descH = descLines.length * DESC_LINE_H;
            }

            return Math.max(ROW_MIN_H, nameH + descH + ROW_PAD);
        };

        // ── Draw a single item row with dynamic height ────────────────
        const drawRow = (item, index, y, cols, isSubItem = false, parentIndex = 0) => {
            const rowH = calcRowHeight(item, cols, isSubItem);
            const descCol = getDescCol(cols);
            const colW = descCol.w - 2 - (isSubItem ? 4 : 0);

            // No shaded background — keep all rows white
            // Bottom border only
            setStroke(...T_ACCENT); doc.setLineWidth(0.1);
            doc.line(ML, y + rowH, ML + CW, y + rowH);

            const snText = isSubItem ? `${parentIndex + 1}.${index + 1}` : `${index + 1}`;
            const hsnText = isSubItem ? '-' : (item.hsn || '');
            const cgstRateText = isSubItem ? '-' : (item.cgstRate + '%');
            const cgstAmtText = isSubItem ? '-' : (item.cgstAmount || '');
            const sgstRateText = isSubItem ? '-' : (item.sgstRate + '%');
            const sgstAmtText = isSubItem ? '-' : (item.sgstAmount || '');
            const igstRateText = isSubItem ? '-' : (item.igstRate + '%');
            const igstAmtText = isSubItem ? '-' : (item.igstAmount || '');
            const amtText = isSubItem ? (item.formattedAmount || '') : (item.totalAmount || '');

            // Build cell data
            const data = isIntraState
                ? [
                    { v: snText,               col: cols[0]  },
                    { v: item.name,            col: cols[1], isName: true, desc: item.detailedDescription, isSubItem },
                    { v: hsnText,              col: cols[2]  },
                    { v: formatIndianNumber(item.qty, 0),   col: cols[3] },
                    { v: item.unit,            col: cols[4]  },
                    { v: formatIndianNumber(item.price, 2), col: cols[5] },
                    { v: cgstRateText,         col: cols[6]  },
                    { v: cgstAmtText,          col: cols[7]  },
                    { v: sgstRateText,         col: cols[8]  },
                    { v: sgstAmtText,          col: cols[9]  },
                    { v: amtText,              col: cols[10] },
                  ]
                : [
                    { v: snText,               col: cols[0]  },
                    { v: item.name,            col: cols[1], isName: true, desc: item.detailedDescription, isSubItem },
                    { v: hsnText,              col: cols[2]  },
                    { v: formatIndianNumber(item.qty, 0),   col: cols[3] },
                    { v: item.unit,            col: cols[4]  },
                    { v: formatIndianNumber(item.price, 2), col: cols[5] },
                    { v: igstRateText,         col: cols[6]  },
                    { v: igstAmtText,          col: cols[7]  },
                    { v: amtText,              col: cols[8]  },
                  ];

            // Vertical centre for single-line cells
            const singleLineY = y + rowH / 2 + 1.5;

            data.forEach(d => {
                const c = d.col;
                const align = c.align === 'right' ? 'right' : c.align === 'center' ? 'center' : 'left';
                let xOff  = align === 'right' ? c.x + c.w - 1
                            : align === 'center' ? c.x + c.w / 2
                            : c.x + 1;

                if (d.isName) {
                    if (d.isSubItem) {
                        xOff += 4; // 4mm indentation for sub-item description
                    }
                    // ── Description column: name bold + desc italic below ──
                    doc.setFontSize(d.isSubItem ? 7.5 : 8); doc.setFont('helvetica', d.isSubItem ? 'normal' : 'bold');
                    const nameLines = doc.splitTextToSize(d.v || '', colW);
                    let textY = y + ROW_PAD / 2 + 3.5;
                    nameLines.forEach(l => {
                        setTxt(...T_DARK_TXT);
                        txt(l, xOff, textY, { align });
                        textY += NAME_LINE_H;
                    });
                    if (d.desc) {
                        doc.setFontSize(6.5); doc.setFont('helvetica', 'italic');
                        const descLines = doc.splitTextToSize(d.desc, colW);
                        descLines.forEach(l => {
                            setTxt(...T_MID_TXT);
                            txt(l, xOff, textY, { align });
                            textY += DESC_LINE_H;
                        });
                    }
                } else {
                    const isSN = c.label === 'S.N.';
                    if (isSN && !isSubItem) bold(8); else normal(7.5);
                    if (isSubItem && d.v === '-') {
                        setTxt(...T_LIGHT_TXT);
                    } else {
                        setTxt(...T_DARK_TXT);
                    }
                    txt(String(d.v||''), xOff, singleLineY, {align});
                }
            });

            return y + rowH;
        };

        // ── Draw totals block (last page only) ──────────────────────
        const drawTotals = (y) => {
            const labelX   = ML + CW * 0.58;
            const valueX   = ML + CW - 2;
            const rowH     = 6.5;

            setStroke(...T_ACCENT); doc.setLineWidth(0.2);
            doc.line(ML, y, ML+CW, y);
            y += 2;

            const totalsRows = [
                { label: 'Taxable Amount', value: 'Rs. ' + calculations.taxableAmount },
                ...(isIntraState
                    ? [
                        { label: 'CGST Amount', value: 'Rs. ' + calculations.totalCgst },
                        { label: 'SGST Amount', value: 'Rs. ' + calculations.totalSgst },
                      ]
                    : [
                        { label: 'IGST Amount', value: 'Rs. ' + calculations.totalIgst },
                      ]
                ),
            ];

            totalsRows.forEach(row => {
                normal(9); setTxt(...T_MID_TXT);
                txt(row.label + ':', labelX, y + 4.5);
                normal(9); setTxt(...T_DARK_TXT);
                txt(row.value, valueX, y + 4.5, { align: 'right' });
                setStroke(...T_LIGHT); doc.setLineWidth(0.1);
                doc.line(ML + CW * 0.56, y + rowH, ML + CW, y + rowH);
                y += rowH;
            });

            y += 2;

            // Grand Total highlighted row — teal
            const gtBoxX = ML + CW * 0.54;
            const gtBoxW = CW * 0.46;
            setFill(...T_PRIMARY); setStroke(...T_PRIMARY);
            doc.rect(gtBoxX, y, gtBoxW, 9, 'F');
            bold(10.5); setTxt(...T_ON_DARK);
            txt('Grand Total:', gtBoxX + 3, y + 6);
            txt('Rs. ' + calculations.grandTotal, valueX, y + 6, { align: 'right' });
            y += 13;

            // Amount in Words
            setStroke(...T_ACCENT); doc.setLineWidth(0.1);
            doc.line(ML, y - 1, ML+CW, y - 1);
            y += 2;
            normal(8.5); setTxt(...T_MID_TXT);
            txt('Amount in Words:', ML, y + 4);
            bold(8.5); setTxt(...T_DARK_TXT);
            const wordsText = 'Rupees ' + numberToWords(calculations.grandTotalRounded);
            const wordsLines = doc.splitTextToSize(wordsText, CW - 42);
            wordsLines.forEach((l, i) => txt(l, ML + 40, y + 4 + (i * 4.5)));
            y += Math.max(9, wordsLines.length * 4.5) + 4;

            return y;
        };

        // ── Draw footer (last page only) ────────────────────────────
        const drawFooter = (y) => {
            doc.setLineWidth(0.4); setStroke(...T_ACCENT);
            doc.line(ML, y, ML+CW, y);
            y += 5;

            // Terms left / Signature right
            bold(8); setTxt(...T_PRIMARY);
            txt('Terms & Conditions', ML, y);
            y += 4;
            normal(7.5); setTxt(...T_MID_TXT);
            const termsLines = doc.splitTextToSize(terms||'', CW * 0.55);
            termsLines.forEach((l,i) => txt(l, ML, y+(i*3.8)));

            // Signature block (right side)
            const sigX = ML + CW * 0.62;
            bold(9); setTxt(...T_PRIMARY);
            txt('For GOODPSYCHE', ML+CW, y, { align: 'right' });

            if (signature) {
                const imgType = signature.substring(signature.indexOf('/')+1, signature.indexOf(';')).toUpperCase();
                doc.addImage(signature, imgType === 'JPEG' ? 'JPEG' : imgType, sigX, y+3, 50, 18);
            }

            // Signatory line
            const sigLineY = y + 28;
            doc.setLineWidth(0.2); setStroke(...T_ACCENT);
            doc.line(sigX, sigLineY, ML+CW, sigLineY);
            bold(8); setTxt(...T_MID_TXT);
            txt('Authorised Signatory', ML+CW, sigLineY + 4, { align: 'right' });

            // E&OE
            normal(7); setTxt(...T_LIGHT_TXT);
            txt('E. & O.E.', ML, sigLineY + 4);

            return sigLineY + 8;
        };

                // ══════════════════════════════════════════════════════════════
        // MAIN RENDER LOGIC
        // ══════════════════════════════════════════════════════════════
        let { y, cols } = drawPageHeader();
        let pageNum = 1;

        // Space needed for totals+footer block at end (~75mm)
        const FOOTER_H = 75;

        const items2 = calculations.calculatedItems;

        for (let i = 0; i < items2.length; i++) {
            const item   = items2[i];
            const hasSubs = item.calculatedSubItems && item.calculatedSubItems.length > 0;
            const isLast = i === items2.length - 1 && !hasSubs;

            // Measure actual height this row needs
            const rowH = calcRowHeight(item, cols, false);

            // Space needed: this row + (if last item without sub-items: totals+footer)
            const neededSpace = rowH + (isLast ? FOOTER_H : 0);

            if (y + neededSpace > PH - MB) {
                doc.addPage();
                pageNum++;
                const result = drawPageHeader();
                y = result.y;
                cols = result.cols;
            }

            y = drawRow(item, i, y, cols, false, 0);

            if (hasSubs) {
                for (let j = 0; j < item.calculatedSubItems.length; j++) {
                    const sub = item.calculatedSubItems[j];
                    const isLastSub = (i === items2.length - 1) && (j === item.calculatedSubItems.length - 1);
                    const subRowH = calcRowHeight(sub, cols, true);
                    const subNeededSpace = subRowH + (isLastSub ? FOOTER_H : 0);

                    if (y + subNeededSpace > PH - MB) {

                        pageNum++;
                        const result = drawPageHeader();
                        y = result.y;
                        cols = result.cols;
                    }

                    y = drawRow(sub, j, y, cols, true, i);
                }
            }

            pageNum++;
            const result = drawPageHeader();
            y = result.y;
            cols = result.cols;
        }

        y = drawTotals(y);

                                 ) : (
                                     <label className="cursor-pointer w-full h-full flex flex-col items-center justify-center border-2 border-dashed rounded-lg text-gray-400 hover:bg-gray-50 hover:text-gray-600 transition-colors">
                                         <ArrowUpTrayIcon className="w-6 h-6 mb-1"/>
                                         <span>Attach Signature</span>
                                         <input type="file" className="hidden" accept="image/*" onChange={handleSignatureUpload} />
                                     </label>
                                 )}
                             </div>
                             <div className="mt-2 pt-2 border-t border-gray-400 w-48">
                                 <p className="font-semibold text-gray-700">Authorised Signatory</p>
                             </div>
                         </div>
                      </div>
                 </footer>
             </div>

             {/* Action Buttons */}
             <div className="no-print fixed bottom-0 right-0 p-6 flex flex-col items-end space-y-4 z-50">
                  <div className="relative group flex justify-center">
                     <button 
                         onClick={handleExportPdf} 
                         className="bg-green-600 text-white rounded-full p-4 shadow-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-transform hover:scale-105"
                         aria-label="Download PDF"
                     >
                         <ArrowDownTrayIcon className="h-6 w-6" />
                     </button>
                     <span className="absolute right-full mr-4 top-1/2 -translate-y-1/2 w-auto min-w-max px-3 py-1.5 bg-gray-700 text-white text-xs rounded-md opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap">
                         Download PDF
                     </span>
                 </div>
                  <div className="relative group flex justify-center">
                     <button 
                         onClick={handlePrint} 
                         className="bg-blue-600 text-white rounded-full p-4 shadow-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform hover:scale-105"
                         aria-label="Print Invoice"
                     >
                         <PrinterIcon className="h-6 w-6" />
                     </button>
                     <span className="absolute right-full mr-4 top-1/2 -translate-y-1/2 w-auto min-w-max px-3 py-1.5 bg-gray-700 text-white text-xs rounded-md opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap">
                         Print Invoice
                     </span>
                 </div>
                  <div className="relative group flex justify-center">
                      <button 
                         onClick={handleReset}
                         className="bg-red-600 text-white rounded-full p-4 shadow-lg hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-transform hover:scale-105"
                         aria-label="Reset Invoice"
                      >
                         <ArrowUturnLeftIcon className="h-6 w-6" />
                      </button>
                      <span className="absolute right-full mr-4 top-1/2 -translate-y-1/2 w-auto min-w-max px-3 py-1.5 bg-gray-700 text-white text-xs rounded-md opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap">
                         Reset Invoice
                      </span>
                 </div>
             </div>
         </div>
     );
};

const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);
    </script>
  </body>
</html>
